<style>
  :root{
    --bg:#0B0E11; --panel:#14181D; --panel2:#1B2027; --line:#262D36;

    --green:#37D67A; --red:#F0603A;
    --mono:ui-monospace,SFMono-Regular,"Roboto Mono",Menlo,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }

  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .panel .cap{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}

  .listbtn:active{background:var(--panel2)}
  .icobox{width:40px;height:40px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .grow{flex:1;min-width:0}

    border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;
    padding:8px 0 calc(12px + env(safe-area-inset-bottom))}

  nav .tab span{font-size:11px;font-weight:600}

    display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 6px 18px rgba(255,106,44,.35);cursor:pointer}

  .sheet{background:var(--bg);border-top:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:480px;
    padding:18px;max-height:88vh;overflow-y:auto}
  .sheet .sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .sheet .sh-head h2{font-size:18px;font-weight:800;margin:0}
  svg.chart{display:block;width:100%;height:auto}
  .filterbar{padding:0 16px 6px}
  .center-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px}
  .brand{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--amber);font-family:var(--mono);font-weight:800;letter-spacing:4px;font-size:26px;margin-bottom:8px}
  .subtitle{color:var(--dim);text-align:center;font-size:14px;margin-bottom:24px}
  .spinner{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

  flag:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22V4M4 4h14l-2 5 2 5H4"/></svg>',
};

function parseTime(str){
  if(!str) return null;
  let s=String(str).trim().replace(/[^0-9.,:]/g,"");
  if(!s) return null;
  let total;
  if(s.includes(",")){
    const parts=s.split(","); const left=parts[0]; const right=parts[1]||"";
    const frac=right?parseFloat("0."+right):0;
    let mm="0",ss=left;
    if(left.includes(":")){[mm,ss]=left.split(":");}
    else if(left.includes(".")){[mm,ss]=left.split(".");}
    const min=parseInt(mm||"0",10); const sec=parseInt(ss||"0",10);
    if(isNaN(min)||isNaN(sec)||isNaN(frac)) return null;
    total=min*60+sec+frac;
  } else if(s.includes(":")){
    const [mm,rest]=s.split(":");
    const min=parseInt(mm,10); const sec=parseFloat(rest);
    if(isNaN(min)||isNaN(sec)) return null;
    total=min*60+sec;
  } else {
    const v=parseFloat(s); if(isNaN(v)) return null; total=v;
  }
  const ms=Math.round(total*1000);
  if(ms<=0||ms>1000*60*20) return null;
  return ms;
}
function fmt(ms){
  if(ms==null||isNaN(ms)) return "–";
  const total=ms/1000;
  if(total>=60){
    const m=Math.floor(total/60); const sec=total-m*60;
    const [w,f]=sec.toFixed(3).split(".");
    return m+"."+w.padStart(2,"0")+","+f;
  }
  const [w,f]=total.toFixed(3).split(".");
  return w+","+f;
}
function lapStats(laps){
  const c=(laps||[]).filter(x=>typeof x==="number"&&x>0);
  if(!c.length) return null;
  const best=Math.min.apply(null,c);
  const avg=c.reduce((a,b)=>a+b,0)/c.length;
  const variance=c.reduce((a,b)=>a+(b-avg)*(b-avg),0)/c.length;
  return {best,avg,std:Math.sqrt(variance),count:c.length};
}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const LS={
  get(k,d){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;} },
  del(k){ try{localStorage.removeItem(k);}catch(e){} }
};
const K_URL="apex.sb.url", K_KEY="apex.sb.key", K_TRACKS="apex.cache.tracks", K_PROFILE="apex.cache.profile";

let sb=null;
let user=null;
let profile=null;
let isAdmin=false;
let tracks=[];
let sessionsCache={};
let leaderCache={};
let route={name:"boot",params:{}};
let filterType="all";
let draft=null;
let loading=false;
let trackTab="own";

function chartSVG(vals,labels,opt){
  opt=opt||{}; const W=328,H=opt.h||160,padL=48,padR=8,padT=8,padB=22;
  if(!vals.length) return "";
  const min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  const span=(max-min)||1;
  const n=vals.length;
  const X=i=> padL+(n<=1?(W-padL-padR)/2:i*(W-padL-padR)/(n-1));
  const Y=v=> padT+(1-(v-min)/span)*(H-padT-padB);
  const col=opt.color||"var(--cyan)";
  const pts=vals.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
  const circles=vals.map((v,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3" fill="'+(v===min?"var(--amber)":col)+'"/>').join("");
  const by=Y(min).toFixed(1);
  const bestLine='<line x1="'+padL+'" y1="'+by+'" x2="'+(W-padR)+'" y2="'+by+'" stroke="var(--amber)" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>';
  const yTop='<text x="4" y="'+(padT+9)+'" fill="var(--dim)" font-size="10" font-family="var(--mono)">'+fmt(max)+'</text>';
  const yBot='<text x="4" y="'+(H-padB+4)+'" fill="var(--amber)" font-size="10" font-family="var(--mono)">'+fmt(min)+'</text>';
  let xl="";
  if(labels&&labels.length){
    const idxs=n<=4?labels.map((_,i)=>i):[0,Math.floor((n-1)/2),n-1];
    xl=idxs.map(i=>{
      const anchor=i===0?"start":i===n-1?"end":"middle";
      return '<text x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" fill="var(--dim)" font-size="9" text-anchor="'+anchor+'">'+esc(labels[i])+'</text>';
    }).join("");
  }
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'
    +bestLine+'<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round"/>'
    +circles+yTop+yBot+xl+'</svg>';
}

function initSupabase(){
  const url=LS.get(K_URL), key=LS.get(K_KEY);
  if(!url||!key) return false;
  if(typeof window.supabase==="undefined") return false;
  try{ sb=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true}}); return true; }
  catch(e){ console.error(e); return false; }
}
async function loadSessionAndProfile(){
  const s=await sb.auth.getSession();
  user = s && s.data && s.data.session ? s.data.session.user : null;
  if(!user){ profile=null; isAdmin=false; return; }
  const p=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  profile = p.data || null;
  LS.set(K_PROFILE, profile);
  const a=await sb.from("admins").select("user_id").eq("user_id",user.id).maybeSingle();
  isAdmin = !!(a.data);
}
async function loadTracks(force){
  const cached=LS.get(K_TRACKS,[]);
  if(cached && cached.length && !force) tracks=cached;
  const r=await sb.from("tracks").select("*").order("region",{ascending:true}).order("name",{ascending:true});
  if(r.error){ console.error(r.error); return; }
  tracks = r.data || [];
  LS.set(K_TRACKS,tracks);
}
async function loadSessions(trackId){
  const r=await sb.from("sessions").select("*").eq("track_id",trackId).order("date",{ascending:false}).order("created_at",{ascending:false});
  sessionsCache[trackId] = r.data || [];
  return sessionsCache[trackId];
}
async function loadLeaderboard(trackId){
  const r=await sb.rpc("leaderboard_for_track",{p_track_id:trackId});
  leaderCache[trackId] = r.data || [];
  return leaderCache[trackId];
}

async function boot(){
  if(!initSupabase()){ route={name:"setup",params:{}}; render(); return; }
  try{
    await loadSessionAndProfile();
    if(!user){ route={name:"authWelcome",params:{}}; render(); return; }
    if(!profile){ route={name:"needProfile",params:{}}; render(); return; }
    await loadTracks();
    route={name:"tracks",params:{}};
    render();
  }catch(e){
    console.error(e);
    route={name:"setup",params:{err:e.message||String(e)}};
    render();
  }
}

  needProfile(p){
    return '<div class="center-screen">'
      +'<div class="brand">'+I.flag+'<span>APEX</span></div>'
      +'<div class="subtitle">Vervollständige dein Profil</div>'
      +'<div class="panel">'
        +'<div class="field"><div class="lb">Fahrername (öffentlich)</div><input id="np-name" type="text" placeholder="z. B. Daniel"></div>'
        +'<div class="row"><div class="field" style="flex:1"><div class="lb">Kart-Nr.</div><input id="np-kart" type="text"></div>'
        +'<div class="field" style="flex:1"><div class="lb">Serie</div><input id="np-series" type="text"></div></div>'

        +(p.err?'<div class="err">'+esc(p.err)+'</div>':'')
        +'<button class="primary" data-action="createProfile">Weiter</button>'
      +'</div></div>';
  },
  tracks(){
    const list=tracks.filter(t=>filterType==="all"?true:t.type===filterType);
    const q=(window.__q||"").toLowerCase();
    const shown=list.filter(t=>(t.name+(t.city||"")+(t.region||"")).toLowerCase().includes(q));
    const seg=[["all","Alle"],["outdoor","Outdoor"],["indoor","Indoor"]]
      .map(function(o){return '<button data-action="filter" data-val="'+o[0]+'" class="'+(filterType===o[0]?"active":"")+'">'+o[1]+'</button>';}).join("");
    let items=shown.map(function(t){
      return '<button class="listbtn" data-action="go" data-go="track" data-id="'+t.id+'">'
        +'<div class="icobox" style="color:'+(t.type==="indoor"?"var(--cyan)":"var(--amber)")+'">'+I.pin+'</div>'
        +'<div class="grow"><div class="name">'+esc(t.name)+'</div>'
        +'<div class="meta">'+esc(t.city||"")+(t.region?" · "+esc(t.region):"")+" · "+(t.type==="indoor"?"Indoor":"Outdoor")+(t.sws?" · SWS":"")+'</div></div></button>';
    }).join("");
    if(!shown.length) items='<div class="empty">Keine Bahn gefunden.'+(isAdmin?' Über das Zahnrad kannst du eine anlegen.':' Über das Zahnrad kannst du eine Bahn <b>vorschlagen</b>.')+'</div>';
    return '<div class="hdr"><div class="grow"><h1>Bahnen</h1><div class="sub">'+tracks.length+' Bahnen'+(isAdmin?' · <span style="color:var(--amber);font-weight:700">Admin</span>':'')+'</div></div>'
      +'<button class="xbtn" data-action="openSettings" style="color:var(--dim);padding:8px">'+I.gear+'</button></div>'
      +'<div class="pad" style="display:flex;gap:8px;padding-bottom:8px">'
        +'<div class="card" style="flex:1;display:flex;align-items:center;gap:8px;padding:10px 12px">'+I.search
          +'<input id="q" type="text" placeholder="Bahn suchen…" style="background:none;border:none;padding:0;color:var(--text)" value="'+esc(window.__q||"")+'"></div>'
      +'</div>'
      +'<div class="filterbar"><div class="seg">'+seg+'</div></div>'
      +'<div class="pad" style="padding-top:8px">'+items+'</div>';
  },
  track(p){
    const t=tracks.find(function(x){return x.id===p.id;});
    if(!t) return '<div class="hdr"><button class="back" data-action="go" data-go="tracks">'+I.back+'</button></div><div class="empty">Bahn nicht gefunden.</div>';
    const own=sessionsCache[t.id]||[];
    const lb=leaderCache[t.id]||[];
    const st=own.length?lapStats(own.map(function(s){return s.best_ms;})):null;
    let website=t.website||"";
    if(website&&!/^https?:\/\//.test(website)) website="https://"+website;
    const tel=t.phone?t.phone.replace(/[^\d+]/g,""):"";
    const routeQ=encodeURIComponent(t.address||(t.name+" "+(t.city||"")));
    let actbtns="";
    if(t.phone) actbtns+='<a class="actbtn" href="tel:'+esc(tel)+'">'+I.phone+'Anrufen</a>';
    if(website) actbtns+='<a class="actbtn" href="'+esc(website)+'" target="_blank" rel="noopener">'+I.globe+'Website</a>';
    actbtns+='<a class="actbtn" href="https://www.google.com/maps/search/?api=1&query='+routeQ+'" target="_blank" rel="noopener">'+I.route+'Route</a>';
    let infoRows="";
    if(t.hours) infoRows+='<div class="detailrow"><span class="k">Öffnungszeiten</span><span>'+esc(t.hours)+'</span></div>';
    if(t.address) infoRows+='<div class="detailrow"><span class="k">Adresse</span><span>'+esc(t.address)+'</span></div>';
    if(t.length_m) infoRows+='<div class="detailrow"><span class="k">Streckenlänge</span><span>'+esc(t.length_m)+' m</span></div>';
    if(t.layout_url){ let lu=t.layout_url; if(!/^https?:\/\//.test(lu)) lu="https://"+lu;
      infoRows+='<div class="detailrow"><span class="k">Layout</span><a href="'+esc(lu)+'" target="_blank" rel="noopener" style="color:var(--cyan)">Streckenlayout ansehen</a></div>'; }

    let tabContent="";
    if(trackTab==="own"){
      if(!own.length){
        tabContent='<div class="empty">Noch keine Runden hier. Tippe unten auf <b style="color:var(--amber)">+</b> für deine erste Session.</div>';
      } else {
        tabContent=own.map(function(s){
          const sst=lapStats(s.laps);
          const isBest=st && st.best===s.best_ms;
          const d=new Date(s.date).toLocaleDateString("de-DE",{day:"2-digit",month:"short",year:"numeric"});
          return '<button class="listbtn" style="border-color:'+(isBest?"var(--amber)":"var(--line)")+'" data-action="go" data-go="session" data-id="'+s.id+'" data-track="'+t.id+'">'
            +'<div class="grow"><div class="name" style="display:flex;align-items:center;gap:6px">'+d+(isBest?'<span style="color:var(--amber)">'+I.trophy+'</span>':'')+'</div>'
            +'<div class="meta">'+(sst?sst.count+" Runden":"")+(s.cond?" · "+esc(s.cond):"")+(s.kart?" · Kart "+esc(s.kart):"")+'</div></div>'
            +'<div style="text-align:right"><div class="time" style="font-size:15px">'+fmt(s.best_ms)+'</div>'
            +'<div class="meta" style="font-family:var(--mono)">Ø '+(sst?fmt(sst.avg):"—")+'</div></div></button>';
        }).join("");
      }
    } else {
      if(!lb.length){
        tabContent='<div class="empty">Noch keine Zeiten von anderen Fahrern. Sei der Erste!</div>';
      } else {
        tabContent='<div class="panel" style="padding:0;overflow:hidden">'+lb.map(function(r,i){
          const rankCls=i===0?"gold":i===1?"silver":i===2?"bronze":"";
          const isMe=user && r.user_id===user.id;
          return '<div class="lbrow'+(isMe?" me":"")+'">'
            +'<div class="rank '+rankCls+'">'+(i+1)+'</div>'
            +'<div class="grow"><div class="name">'+esc(r.user_name)+(isMe?' <span style="color:var(--amber);font-size:11px;font-weight:700">DU</span>':'')+'</div>'
            +'<div class="meta">'+r.session_count+" Session"+(r.session_count==1?"":"s")+" · zuletzt "+new Date(r.last_session).toLocaleDateString("de-DE")+'</div></div>'
            +'<div class="time" style="font-size:16px">'+fmt(r.best_ms)+'</div></div>';
        }).join("")+'</div>';
      }
    }

    return '<div class="hdr"><button class="back" data-action="go" data-go="tracks">'+I.back+'</button>'
      +'<div class="grow"><h1>'+esc(t.name)+'</h1><div class="sub">'+esc(t.city||"")+(t.region?" · "+esc(t.region):"")+" · "+(t.type==="indoor"?"Indoor":"Outdoor")+(t.sws?" · SWS":"")+'</div></div>'
      +(isAdmin?'<button class="xbtn" data-action="openEditTrack" data-id="'+t.id+'" style="color:var(--cyan);padding:8px">'+I.edit+'</button>':'')+'</div>'
      +'<div class="pad">'
      +'<div class="row" style="margin-bottom:14px">'
        +'<div class="statcard"><div class="v time">'+(st?fmt(st.best):"—")+'</div><div class="l">Deine Bestzeit</div></div>'
        +'<div class="statcard"><div class="v" style="color:var(--cyan)">'+own.length+'</div><div class="l">Deine Sessions</div></div>'
      +'</div>'
      +'<div class="panel"><div class="cap">Streckeninfos</div>'
        +'<div class="actbtns">'+actbtns+'</div>'
        +(infoRows||'<div class="hint">Noch keine Infos hinterlegt.</div>')
      +'</div>'
      +'<div class="tabs">'
        +'<button data-action="setTab" data-val="own" class="'+(trackTab==="own"?"active":"")+'">Deine Sessions ('+own.length+')</button>'
        +'<button data-action="setTab" data-val="leader" class="'+(trackTab==="leader"?"active":"")+'">Bestenliste ('+lb.length+')</button>'
      +'</div>'
      +tabContent
      +'</div>';
  },
  session(p){
    const s=(sessionsCache[p.track]||[]).find(function(x){return x.id===p.id;});
    if(!s) return '<div class="hdr"><button class="back" data-action="go" data-go="track" data-id="'+p.track+'">'+I.back+'</button></div><div class="empty">Session nicht gefunden.</div>';
    const t=tracks.find(function(x){return x.id===s.track_id;});
    const st=lapStats(s.laps);
    const own=sessionsCache[s.track_id]||[];
    const tb=own.length?Math.min.apply(null,own.map(function(x){return x.best_ms;})):null;
    const isTB=tb && st && st.best===tb;
    const vals=s.laps.slice(); const labels=s.laps.map(function(_,i){return String(i+1);});
    const lapsHtml=s.laps.map(function(ms,i){
      const b=st.best===ms;
      return '<div class="laprow"><span class="lapidx">'+(i+1)+'</span><span class="lapval'+(b?" best":"")+'">'+fmt(ms)+'</span>'+(b?'<span class="badge">BEST</span>':'')+'</div>';
    }).join("");
    const d=new Date(s.date).toLocaleDateString("de-DE",{day:"2-digit",month:"long",year:"numeric"});
    return '<div class="hdr"><button class="back" data-action="go" data-go="track" data-id="'+s.track_id+'">'+I.back+'</button>'
      +'<div class="grow"><h1>'+d+'</h1><div class="sub">'+(t?esc(t.name):"")+'</div></div>'
      +'<button class="xbtn" data-action="delSession" data-id="'+s.id+'" data-track="'+s.track_id+'" style="padding:6px">'+I.trash+'</button></div>'
      +'<div class="pad">'
      +(isTB?'<div class="card" style="border-color:var(--amber);background:rgba(255,106,44,.12);display:flex;align-items:center;gap:10px;margin-bottom:14px"><span style="color:var(--amber)">'+I.trophy+'</span><span style="color:var(--amber);font-weight:700;font-size:13px">Persönliche Bestzeit auf dieser Bahn</span></div>':'')
      +'<div class="panel readout"><div class="cap">Schnellste Runde</div><div class="big">'+(st?fmt(st.best):"—")+'</div>'
        +'<div style="display:flex;gap:18px;margin-top:10px">'
        +'<div class="mini"><div class="v">'+(st?fmt(st.avg):"—")+'</div><div class="l">Ø-Zeit</div></div>'
        +'<div class="mini"><div class="v" style="color:var(--cyan)">'+(st?fmt(st.std):"—")+'</div><div class="l">Konstanz ±</div></div>'
        +'<div class="mini"><div class="v">'+(st?st.count:0)+'</div><div class="l">Runden</div></div></div></div>'
      +(vals.length>=2?'<div class="panel"><div class="cap">Runde für Runde</div>'+chartSVG(vals,labels,{color:"var(--cyan)"})+'</div>':'')
      +'<div class="panel"><div class="cap">Alle Runden</div>'+lapsHtml+'</div>'
      +((s.cond||s.kart||s.notes)?'<div class="panel"><div class="cap">Details</div>'
        +(s.cond?'<div class="detailrow"><span class="k">Bedingungen</span><span>'+esc(s.cond)+'</span></div>':'')
        +(s.kart?'<div class="detailrow"><span class="k">Kart-Nr.</span><span>'+esc(s.kart)+'</span></div>':'')
        +(s.notes?'<div class="detailrow"><span class="k">Notizen</span><span>'+esc(s.notes)+'</span></div>':'')+'</div>':'')
      +'<div style="height:10px"></div></div>';
  },
  "new"(p){
    if(!draft) draft={trackId:p.id||(tracks[0]&&tracks[0].id)||"",cond:"trocken",laps:[]};
    const today=new Date().toISOString().slice(0,10);
    const opts=tracks.map(function(t){return '<option value="'+t.id+'"'+(t.id===draft.trackId?" selected":"")+'>'+esc(t.name)+" — "+esc(t.city||"")+'</option>';}).join("");
    const cond=[["trocken","Trocken"],["feucht","Feucht"],["nass","Nass"]]
      .map(function(o){return '<button data-action="setCond" data-val="'+o[0]+'" class="'+(draft.cond===o[0]?"active":"")+'">'+o[1]+'</button>';}).join("");
    return '<div class="hdr"><button class="back" data-action="cancelNew">'+I.back+'</button><div class="grow"><h1>Neue Session</h1></div></div>'
      +'<div class="pad">'
      +'<div class="field"><div class="lb">Bahn</div><select id="ns-track">'+opts+'</select></div>'
      +'<div class="row"><div class="field" style="flex:1"><div class="lb">Datum</div><input id="ns-date" type="date" value="'+today+'"></div>'
        +'<div class="field" style="width:110px"><div class="lb">Kart-Nr.</div><input id="ns-kart" type="text" placeholder="—"></div></div>'
      +'<div class="field"><div class="lb">Bedingungen</div><div class="seg" id="ns-cond">'+cond+'</div></div>'
      +'<div class="caplabel">Rundenzeiten</div>'
      +'<div style="display:flex;gap:8px"><input id="ns-lap" class="lapin" inputmode="decimal" placeholder="48,372 oder 1.01,982">'
        +'<button class="btn-add" data-action="addLap">Runde +</button></div>'
      +'<div id="ns-err" class="err"></div>'
      +'<div id="ns-laps"></div>'
      +'<div class="field" style="margin-top:12px"><div class="lb">Notizen (optional)</div><textarea id="ns-notes" rows="2" placeholder="Setup, Reifen, Gefühl…"></textarea></div>'
      +'<button class="primary" id="ns-save" data-action="saveSession" style="margin:16px 0"'+(loading?' disabled':'')+'>'
        +(loading?'<span class="spinner"></span> Speichern…':'Session speichern')+'</button>'
      +'</div>';
  },
  stats(){
    const own=[];
    Object.keys(sessionsCache).forEach(function(k){ own.push.apply(own,sessionsCache[k]); });
    const bestBy={};
    own.forEach(function(s){ if(!bestBy[s.track_id]||s.best_ms<bestBy[s.track_id]) bestBy[s.track_id]=s.best_ms; });
    const totalLaps=own.reduce(function(a,s){return a+(s.laps?s.laps.length:0);},0);
    let allTime=null;
    own.forEach(function(s){ if(!allTime||s.best_ms<allTime.ms) allTime={ms:s.best_ms,trackId:s.track_id,date:s.date}; });
    const at=allTime && tracks.find(function(t){return t.id===allTime.trackId;});
    const driven=tracks.filter(function(t){return bestBy[t.id]!=null;});
    let rank=driven.map(function(t){return {t:t,best:bestBy[t.id]};}).sort(function(a,b){return a.best-b.best;})
      .map(function(o){return '<button class="listbtn" data-action="go" data-go="track" data-id="'+o.t.id+'">'
        +'<span style="color:'+(o.t.type==="indoor"?"var(--cyan)":"var(--amber)")+'">'+I.gauge+'</span>'
        +'<div class="grow"><div class="name">'+esc(o.t.name)+'</div><div class="meta">'+esc(o.t.city||"")+'</div></div>'
        +'<div class="time" style="font-size:16px">'+fmt(o.best)+'</div></button>';}).join("");
    if(!driven.length) rank='<div class="empty">Noch keine Daten. Trag deine erste Session ein.</div>';
    const hasProfile=profile && (profile.name||profile.kart||profile.series);
    const ph=hasProfile
      ? '<div class="card" style="margin-bottom:12px;display:flex;align-items:center;gap:12px">'
        +'<div style="width:44px;height:44px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--amber);font-weight:800;font-size:18px">'+esc((profile.name||"?").slice(0,1).toUpperCase())+'</div>'
        +'<div class="grow"><div style="font-weight:700">'+esc(profile.name||"—")+'</div>'
        +'<div class="meta">'+[profile.series&&esc(profile.series),profile.kart&&"Kart "+esc(profile.kart),profile.instagram&&esc(profile.instagram)].filter(Boolean).join(" · ")+'</div></div></div>'
      : '';
    return '<div class="hdr"><div class="grow"><h1>Statistik</h1><div class="sub">Deine Rekorde & Fortschritte</div></div></div>'
      +'<div class="pad">'+ph
      +'<div class="row" style="margin-bottom:12px">'
        +'<div class="statcard"><div class="v" style="color:var(--cyan)">'+own.length+'</div><div class="l">Sessions</div></div>'
        +'<div class="statcard"><div class="v" style="color:var(--amber)">'+totalLaps+'</div><div class="l">Runden</div></div>'
        +'<div class="statcard"><div class="v" style="color:var(--green)">'+driven.length+'</div><div class="l">Bahnen</div></div>'
      +'</div>'
      +(allTime?'<div class="panel" style="border-color:var(--amber)"><div class="cap" style="color:var(--amber);display:flex;align-items:center;gap:8px">'+I.trophy+' Deine schnellste Runde</div>'
        +'<div style="font-family:var(--mono);font-size:40px;font-weight:800;color:var(--amber)">'+fmt(allTime.ms)+'</div>'
        +'<div class="meta">'+(at?esc(at.name):"")+" · "+new Date(allTime.date).toLocaleDateString("de-DE")+'</div></div>':'')
      +'<div class="caplabel">Bestzeiten pro Bahn</div>'+rank
      +'<div style="height:10px"></div></div>';
  }
};

    +(extraMsg?'<div class="ok" style="margin-bottom:10px">'+esc(extraMsg)+'</div>':'')
    +'<div class="card" style="margin-bottom:12px">'
      +'<div style="font-weight:700;font-size:14px;margin-bottom:6px">Angemeldet als</div>'
      +'<div class="meta" style="margin-bottom:10px">'+esc(email)+(isAdmin?' · <span style="color:var(--amber);font-weight:700">Admin</span>':'')+'</div>'
      +'<button class="ghost" data-action="doLogout">Abmelden</button>'
    +'</div>'
    +'<div class="card" style="margin-bottom:12px">'
      +'<div style="font-weight:700;font-size:14px;margin-bottom:6px">Dein Profil</div>'
      +'<div class="field"><div class="lb">Fahrername</div><input id="pf-name" type="text" value="'+esc(profile?profile.name:"")+'"></div>'
      +'<div class="row"><div class="field" style="flex:1"><div class="lb">Kart-Nr.</div><input id="pf-kart" type="text" value="'+esc(profile?profile.kart||"":"")+'"></div>'
      +'<div class="field" style="flex:1"><div class="lb">Serie</div><input id="pf-series" type="text" value="'+esc(profile?profile.series||"":"")+'"></div></div>'
      +'<div class="field"><div class="lb">Instagram</div><input id="pf-ig" type="text" value="'+esc(profile?profile.instagram||"":"")+'"></div>'
      +'<button class="primary" data-action="updateProfile">Profil speichern</button>'
    +'</div>'
    +'<div class="card" style="margin-bottom:12px">'
      +'<div style="font-weight:700;font-size:14px;margin-bottom:6px">Bahn vorschlagen</div>'
      +'<div class="hint" style="margin-bottom:10px">Deine Bahn fehlt? Sende eine Anfrage – wir prüfen sie und nehmen sie auf.</div>'
      +'<button class="ghost" data-action="openRequestTrack">Bahn-Anfrage stellen</button>'
    +'</div>'
    +(isAdmin?
      '<div class="card" style="margin-bottom:12px;border-color:var(--amber)">'
      +'<div style="font-weight:700;font-size:14px;margin-bottom:6px;color:var(--amber)">Admin</div>'
      +'<button class="ghost" data-action="openNewTrack" style="margin-top:0">Neue Bahn anlegen</button>'
      +'<button class="ghost" data-action="openRequests">Offene Anfragen ansehen</button>'
    +'</div>':'')
    +'<div class="hint" style="text-align:center"><button class="xbtn" data-action="go" data-go="setup" style="color:var(--dim);text-decoration:underline">Server-Einstellungen</button></div>');
}

function trackRequestSheet(){
  openSheet('<div class="sh-head"><h2>Bahn vorschlagen</h2><button class="xbtn" data-action="closeSheet">'+I.x+'</button></div>'
    +'<div class="field"><div class="lb">Name der Bahn</div><input id="rq-name" type="text" placeholder="z. B. Kart Center X"></div>'
    +'<div class="field"><div class="lb">Ort</div><input id="rq-city" type="text" placeholder="Stadt"></div>'
    +'<div class="field"><div class="lb">Bundesland</div><input id="rq-region" type="text"></div>'
    +'<div class="field"><div class="lb">Notizen (Website, Telefon, …)</div><textarea id="rq-notes" rows="3"></textarea></div>'
    +'<div id="rq-err" class="err"></div>'
    +'<button class="primary" data-action="submitRequest">Anfrage senden</button>');
}

function trackFormSheet(existing){
  const t=existing||{name:"",city:"",region:"",type:"outdoor",sws:false,website:"",phone:"",address:"",hours:"",length_m:"",layout_url:""};
  const isEdit=!!existing;
  openSheet('<div class="sh-head"><h2>'+(isEdit?"Bahn bearbeiten":"Neue Bahn")+'</h2><button class="xbtn" data-action="closeSheet">'+I.x+'</button></div>'
    +(isEdit?'<input type="hidden" id="tf-id" value="'+esc(existing.id)+'">':'')
    +'<div class="field"><div class="lb">Name</div><input id="tf-name" type="text" value="'+esc(t.name)+'"></div>'
    +'<div class="row"><div class="field" style="flex:1"><div class="lb">Ort</div><input id="tf-city" type="text" value="'+esc(t.city||"")+'"></div>'
    +'<div class="field" style="flex:1"><div class="lb">Bundesland</div><input id="tf-region" type="text" value="'+esc(t.region||"")+'"></div></div>'
    +'<div class="field"><div class="lb">Typ</div><div class="seg" id="tf-type">'
      +'<button data-action="tfType" data-val="outdoor" class="'+(t.type==="outdoor"?"active":"")+'">Outdoor</button>'
      +'<button data-action="tfType" data-val="indoor" class="'+(t.type==="indoor"?"active":"")+'">Indoor</button></div></div>'
    +'<label style="display:flex;align-items:center;gap:10px;margin:6px 0"><input type="checkbox" id="tf-sws" '+(t.sws?"checked":"")+' style="width:18px;height:18px;accent-color:var(--amber)"><span style="font-size:14px">SWS-Bahn</span></label>'
    +'<div class="field"><div class="lb">Website</div><input id="tf-web" type="url" value="'+esc(t.website||"")+'"></div>'
    +'<div class="field"><div class="lb">Telefon</div><input id="tf-phone" type="tel" value="'+esc(t.phone||"")+'"></div>'
    +'<div class="field"><div class="lb">Adresse</div><input id="tf-addr" type="text" value="'+esc(t.address||"")+'"></div>'
    +'<div class="field"><div class="lb">Öffnungszeiten</div><input id="tf-hours" type="text" value="'+esc(t.hours||"")+'"></div>'
    +'<div class="row"><div class="field" style="flex:1"><div class="lb">Länge in m</div><input id="tf-len" type="text" value="'+esc(t.length_m||"")+'"></div>'
    +'<div class="field" style="flex:1"><div class="lb">Layout-URL</div><input id="tf-layout" type="url" value="'+esc(t.layout_url||"")+'"></div></div>'
    +'<div id="tf-err" class="err"></div>'
    +'<button class="primary" data-action="saveTrackForm" data-mode="'+(isEdit?"edit":"new")+'">'+(isEdit?"Änderungen speichern":"Bahn anlegen")+'</button>');
  window.__tfType=t.type;
}

async function requestsSheet(){
  const r=await sb.from("track_requests").select("*").eq("status","open").order("created_at",{ascending:false});
  if(r.error){ openSheet('<div class="sh-head"><h2>Anfragen</h2><button class="xbtn" data-action="closeSheet">'+I.x+'</button></div><div class="err">'+esc(r.error.message)+'</div>'); return; }
  const rows=(r.data||[]).map(function(x){
    return '<div class="card" style="margin-bottom:10px">'
      +'<div style="font-weight:700">'+esc(x.track_name)+'</div>'
      +'<div class="meta">'+esc(x.city||"")+(x.region?" · "+esc(x.region):"")+'</div>'
      +(x.notes?'<div style="font-size:13px;margin-top:6px;color:var(--dim)">'+esc(x.notes)+'</div>':'')
      +'<div style="display:flex;gap:8px;margin-top:10px">'
        +'<button class="btn-add" data-action="acceptReq" data-id="'+x.id+'" data-name="'+esc(x.track_name)+'" data-city="'+esc(x.city||"")+'" data-region="'+esc(x.region||"")+'">Als Bahn übernehmen</button>'
        +'<button class="ghost" data-action="declineReq" data-id="'+x.id+'" style="margin:0;flex:1">Ablehnen</button>'
      +'</div></div>';
  }).join("");
  openSheet('<div class="sh-head"><h2>Anfragen ('+(r.data||[]).length+')</h2><button class="xbtn" data-action="closeSheet">'+I.x+'</button></div>'
    +(rows||'<div class="empty">Keine offenen Anfragen.</div>'));
}

function renderLaps(){
  const box=document.getElementById("ns-laps"); if(!box||!draft) return;
  if(!draft.laps.length){ box.innerHTML=""; return; }
  const st=lapStats(draft.laps);
  const rows=draft.laps.map(function(ms,i){
    const b=st.best===ms;
    return '<div class="laprow"><span class="lapidx">'+(i+1)+'</span><span class="lapval'+(b?" best":"")+'">'+fmt(ms)+'</span>'
      +(b?'<span class="badge">BEST</span>':'')+'<button class="xbtn" data-action="delLap" data-val="'+i+'">'+I.x+'</button></div>';
  }).join("");
  box.innerHTML='<div class="card" style="margin-top:10px;padding:0;overflow:hidden">'+rows
    +'<div class="lapfoot"><div class="mini"><div class="v best">'+fmt(st.best)+'</div><div class="l">Best</div></div>'
    +'<div class="mini"><div class="v">'+fmt(st.avg)+'</div><div class="l">Ø</div></div>'
    +'<div class="mini"><div class="v" style="color:var(--cyan)">'+fmt(st.std)+'</div><div class="l">Konstanz ±</div></div></div></div>';
}

function renderNav(){
  const nav=document.getElementById("nav");
  const authed=user && profile;
  if(!authed){ nav.classList.add("hidden"); nav.innerHTML=""; return; }
  nav.classList.remove("hidden");
  const inTracks=route.name==="tracks"||route.name==="track";
  const inStats=route.name==="stats";
  nav.innerHTML=
    '<button class="tab '+(inTracks?"active":"")+'" data-action="go" data-go="tracks">'+I.navPin+'<span>Bahnen</span></button>'
    +'<button class="fab" data-action="newSession">'+I.plus+'</button>'
    +'<button class="tab '+(inStats?"active":"")+'" data-action="go" data-go="stats">'+I.navStat+'<span>Statistik</span></button>';
}

function go(name,params){
  route={name:name,params:params||{}};
  render();
  window.scrollTo(0,0);
  if(name==="track" && params && params.id && sb){
    loadSessions(params.id).then(function(){ render(); });
    loadLeaderboard(params.id).then(function(){ render(); });
  }
  if(name==="stats" && sb){
    sb.from("sessions").select("*").order("date",{ascending:false}).then(function(res){
      if(res.data){
        sessionsCache={};
        res.data.forEach(function(s){
          if(!sessionsCache[s.track_id]) sessionsCache[s.track_id]=[];
          sessionsCache[s.track_id].push(s);
        });
        render();
      }
    });
  }
}

function render(){
  const v = views[route.name] || views.boot;
  document.getElementById("app").innerHTML = v(route.params);
  renderNav();
  if(route.name==="new"){ renderLaps(); bindNew(); }
  if(route.name==="tracks"){
    const q=document.getElementById("q");
    if(q){ q.addEventListener("input",function(e){window.__q=e.target.value; softRerenderTracks();}); }
  }
}
function softRerenderTracks(){
  const html=views.tracks();
  const app=document.getElementById("app");
  const tmp=document.createElement("div"); tmp.innerHTML=html;
  const nl=tmp.querySelector(".pad:last-child"), cl=app.querySelector(".pad:last-child");
  if(nl&&cl) cl.innerHTML=nl.innerHTML;
  const nf=tmp.querySelector(".filterbar"), cf=app.querySelector(".filterbar");
  if(nf&&cf) cf.innerHTML=nf.innerHTML;
}
function bindNew(){
  const lap=document.getElementById("ns-lap");
  if(lap) lap.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); doAddLap(); }});
}
function doAddLap(){
  const inp=document.getElementById("ns-lap"); const err=document.getElementById("ns-err");
  const ms=parseTime(inp.value);
  if(ms==null){ err.textContent="Format: 48,372 oder 1.01,982"; return; }
  draft.laps.push(ms); inp.value=""; err.textContent=""; renderLaps(); inp.focus();
}

document.addEventListener("click",async function(e){
  const a=e.target.closest("[data-action]"); if(!a) return;
  const act=a.dataset.action, val=a.dataset.val, id=a.dataset.id;
  try{
    switch(act){
      case "go": go(a.dataset.go, id?{id:id,track:a.dataset.track}:{}); break;
      case "setTab": trackTab=val; render(); break;
      case "filter": filterType=val; softRerenderTracks(); break;
      case "newSession": draft=null; go("new",route.name==="track"?{id:route.params.id}:{}); break;
      case "cancelNew": draft=null; go(route.params.id?"track":"tracks",route.params.id?{id:route.params.id}:{}); break;
      case "addLap": doAddLap(); break;
      case "delLap": draft.laps.splice(parseInt(val,10),1); renderLaps(); break;
      case "setCond":
        draft.cond=val;
        document.querySelectorAll("#ns-cond button").forEach(function(b){b.classList.toggle("active",b.dataset.val===val);});
        break;
      case "saveSession": await saveSessionAction(); break;
      case "delSession": await deleteSessionAction(id, a.dataset.track); break;
      case "openSettings": settingsSheet(); break;
      case "openRequestTrack": trackRequestSheet(); break;
      case "submitRequest": await submitRequestAction(); break;
      case "openNewTrack": trackFormSheet(null); break;
      case "openEditTrack": trackFormSheet(tracks.find(function(t){return t.id===id;})); break;
      case "tfType":
        window.__tfType=val;
        document.querySelectorAll("#tf-type button").forEach(function(b){b.classList.toggle("active",b.dataset.val===val);});
        break;
      case "saveTrackForm": await saveTrackFormAction(a.dataset.mode); break;
      case "openRequests": await requestsSheet(); break;
      case "acceptReq": await acceptRequestAction(id, a.dataset.name, a.dataset.city, a.dataset.region); break;
      case "declineReq": await declineRequestAction(id); break;
      case "updateProfile": await updateProfileAction(); break;
      case "doLogin": await doLoginAction(); break;
      case "doSignup": await doSignupAction(); break;
      case "createProfile": await createProfileAction(); break;
      case "doLogout": await doLogoutAction(); break;
      case "saveConfig": saveConfigAction(); break;
      case "closeSheet": closeSheet(); break;
    }
  }catch(err){
    console.error(err);
    alert("Fehler: "+(err.message||err));
  }
});

function saveConfigAction(){
  const url=document.getElementById("cfg-url").value.trim();
  const key=document.getElementById("cfg-key").value.trim();
  if(!url||!key){ alert("URL und Key sind Pflichtfelder."); return; }
  LS.set(K_URL,url); LS.set(K_KEY,key);
  boot();
}
async function doLoginAction(){
  const email=document.getElementById("lg-email").value.trim();
  const pw=document.getElementById("lg-pw").value;
  loading=true; render();
  const r=await sb.auth.signInWithPassword({email:email,password:pw});
  loading=false;
  if(r.error){ route={name:"authLogin",params:{err:r.error.message}}; render(); return; }
  await boot();
}
async function doSignupAction(){
  const name=document.getElementById("su-name").value.trim();
  const email=document.getElementById("su-email").value.trim();
  const pw=document.getElementById("su-pw").value;
  const kart=document.getElementById("su-kart").value.trim();
  const series=document.getElementById("su-series").value.trim();
  const ig=document.getElementById("su-ig").value.trim();
  if(name.length<2){ route={name:"authSignup",params:{err:"Bitte einen Fahrernamen angeben."}}; render(); return; }
  if(pw.length<8){ route={name:"authSignup",params:{err:"Passwort muss mindestens 8 Zeichen haben."}}; render(); return; }
  loading=true; render();
  const r=await sb.auth.signUp({email:email,password:pw});
  loading=false;
  if(r.error){ route={name:"authSignup",params:{err:r.error.message}}; render(); return; }
  const s=await sb.auth.getSession();
  const session = s && s.data && s.data.session;
  if(!session){
    route={name:"authSignup",params:{info:"Registriert! Bitte prüfe deine E-Mails und bestätige deinen Account, dann anmelden."}}; render(); return;
  }
  user = session.user;
  const pe=await sb.from("profiles").insert({id:user.id,name:name,kart:kart,series:series,instagram:ig});
  if(pe.error){ route={name:"authSignup",params:{err:"Profil konnte nicht angelegt werden: "+pe.error.message}}; render(); return; }
  await boot();
}
async function createProfileAction(){
  const name=document.getElementById("np-name").value.trim();
  if(name.length<2){ route={name:"needProfile",params:{err:"Bitte einen Fahrernamen angeben."}}; render(); return; }
  const r=await sb.from("profiles").insert({
    id:user.id,name:name,
    kart:document.getElementById("np-kart").value.trim(),
    series:document.getElementById("np-series").value.trim(),
    instagram:document.getElementById("np-ig").value.trim()
  });
  if(r.error){ route={name:"needProfile",params:{err:r.error.message}}; render(); return; }
  await boot();
}
async function doLogoutAction(){
  await sb.auth.signOut();
  user=null; profile=null; isAdmin=false; sessionsCache={}; leaderCache={};
  LS.del(K_PROFILE);
  closeSheet();
  route={name:"authWelcome",params:{}}; render();
}
async function updateProfileAction(){
  const name=document.getElementById("pf-name").value.trim();
  if(name.length<2){ alert("Fahrername ist Pflicht."); return; }
  const patch={name:name,kart:document.getElementById("pf-kart").value.trim(),series:document.getElementById("pf-series").value.trim(),instagram:document.getElementById("pf-ig").value.trim()};
  const r=await sb.from("profiles").update(patch).eq("id",user.id).select().maybeSingle();
  if(r.error){ alert("Fehler: "+r.error.message); return; }
  profile = r.data;
  LS.set(K_PROFILE, profile);
  settingsSheet("Profil gespeichert.");
}
async function saveSessionAction(){
  const trackId=document.getElementById("ns-track").value;
  const date=document.getElementById("ns-date").value||new Date().toISOString().slice(0,10);
  const kart=document.getElementById("ns-kart").value.trim();
  const notes=document.getElementById("ns-notes").value.trim();
  const errBox=document.getElementById("ns-err");
  if(!draft.laps.length){ errBox.textContent="Trage mindestens eine Runde ein."; return; }
  loading=true; render();
  const best=Math.min.apply(null,draft.laps);
  const r=await sb.from("sessions").insert({
    user_id:user.id,track_id:trackId,date:date,kart:kart,cond:draft.cond,notes:notes,laps:draft.laps,best_ms:best
  }).select().maybeSingle();
  loading=false;
  if(r.error){ render(); document.getElementById("ns-err").textContent=r.error.message; return; }
  if(!sessionsCache[trackId]) sessionsCache[trackId]=[];
  sessionsCache[trackId].unshift(r.data);
  delete leaderCache[trackId];
  draft=null;
  go("session",{id:r.data.id,track:trackId});
}
async function deleteSessionAction(id, trackId){
  if(!confirm("Diese Session löschen?")) return;
  const r=await sb.from("sessions").delete().eq("id",id);
  if(r.error){ alert(r.error.message); return; }
  if(sessionsCache[trackId]) sessionsCache[trackId] = sessionsCache[trackId].filter(function(s){return s.id!==id;});
  delete leaderCache[trackId];
  go("track",{id:trackId});
}
async function submitRequestAction(){
  const name=document.getElementById("rq-name").value.trim();
  const city=document.getElementById("rq-city").value.trim();
  const region=document.getElementById("rq-region").value.trim();
  const notes=document.getElementById("rq-notes").value.trim();
  const errBox=document.getElementById("rq-err");
  if(name.length<2){ errBox.textContent="Bitte einen Bahnnamen angeben."; return; }
  const r=await sb.from("track_requests").insert({user_id:user.id,track_name:name,city:city,region:region,notes:notes});
  if(r.error){ errBox.textContent=r.error.message; return; }
  closeSheet();
  settingsSheet("Anfrage gesendet. Danke!");
}
async function saveTrackFormAction(mode){
  const errBox=document.getElementById("tf-err");
  const name=document.getElementById("tf-name").value.trim();
  if(name.length<2){ errBox.textContent="Name ist Pflicht."; return; }
  const payload={
    name:name,
    city:document.getElementById("tf-city").value.trim(),
    region:document.getElementById("tf-region").value.trim(),
    type:window.__tfType||"outdoor",
    sws:document.getElementById("tf-sws").checked,
    website:document.getElementById("tf-web").value.trim()||null,
    phone:document.getElementById("tf-phone").value.trim()||null,
    address:document.getElementById("tf-addr").value.trim()||null,
    hours:document.getElementById("tf-hours").value.trim()||null,
    length_m:parseInt(document.getElementById("tf-len").value,10)||null,
    layout_url:document.getElementById("tf-layout").value.trim()||null
  };
  if(mode==="edit"){
    const id=document.getElementById("tf-id").value;
    const r=await sb.from("tracks").update(payload).eq("id",id);
    if(r.error){ errBox.textContent=r.error.message; return; }
  } else {
    const r=await sb.from("tracks").insert(payload);
    if(r.error){ errBox.textContent=r.error.message; return; }
  }
  await loadTracks(true);
  closeSheet();
  render();
}
async function acceptRequestAction(id, name, city, region){
  const r1=await sb.from("tracks").insert({name:name,city:city||null,region:region||null,type:"outdoor",sws:false});
  if(r1.error){ alert("Bahn anlegen fehlgeschlagen: "+r1.error.message); return; }
  await sb.from("track_requests").update({status:"accepted"}).eq("id",id);
  await loadTracks(true);
  await requestsSheet();
}
async function declineRequestAction(id){
  await sb.from("track_requests").update({status:"declined"}).eq("id",id);
  await requestsSheet();
}

boot();
</script>
</body>
</html>
